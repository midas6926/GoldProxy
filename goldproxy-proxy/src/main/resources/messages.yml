# Messages templates for GoldProxy - proxy side

# Private messages
pm:
  outgoing: "&7[&bTo &f{to}&7] &r{message}"
  incoming: "&7[&aFrom &f{from}&7] &r{message}"
  reply-prefix: "&7[&eYou&r -> &f{to}&7] &r{message}"

# Maintenance
maintenance:
  broadcast: "&cServer under maintenance: {message}"
  deny-kick: "&cServer is under maintenance, only staff can join right now."

# Auto-messages
automessages:
  default: "&6Join our Discord: {discord}"

# Social commands
social:
  twitch: "&6Twitch: {twitch}"
  discord: "&6Discord: {discord}"
  website: "&6Website: {website}"
  store: "&6Store: {store}"

# Server info
serverinfo:
  header: "&eServer Info for {server}"
  online: "&aPlayers: {online}/{max}"
  tps: "&aTPS: {tps}"

# Anti-hack
hack:
  detected: "&cSuspicious client detected for {player} (brand={brand}). Action: {action}"

# Permissions
permission:
  no-permission: "&cYou don't have permission to use this command."
  invalid-target: "&cPlayer {target} not found or offline."

# Friends
friends:
  added: "&aAdded {target} to your friends."
  already: "&e{target} is already your friend."
  removed: "&cRemoved {target} from your friends."
  notfound: "&c{target} is not in your friends list."
  list.header: "&6Your friends:"
  list.empty: "&eYou have no friends."
  list.entry_online: "&a{0} - online on {server}"
  list.entry_offline: "&7{0} - offline"
  list.entry_recent: "&7{0} - left {mins} minutes ago"
  notify_online: "&aYour friend {name} has joined on {server}"
  notify_left: "&eYour friend {name} has left the network."
  notify_you_friend_online: "&aYour friend {name} is online on {server}"
  notify_you_recently_left: "&7Your friend {name} left {mins} minutes ago"
  gui:
    title: "Friends"
    connect_success: "Connecting to {server}..."
    connect_fail: "Failed to connect to {server}."
    item_name: "{name}"
    item_lore_online: "Online on: {server}"
    item_lore_offline: "Last seen: {lastSeen} minutes ago"

# Generic
generic:
  unknown-error: "&cAn unknown error occurred. Check server logs."
